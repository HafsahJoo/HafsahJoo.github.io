<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // Check if we're on the 404 page and redirect only when necessary
      if (window.location.pathname !== '/404.html') {
        // Redirect to the correct path in the Single Page Application (SPA)
        window.location.replace(window.location.origin + window.location.pathname);
      } else {
        // Prevent infinite redirects in case something goes wrong
        window.location.replace(window.location.origin + '/index.html');
      }
    </script>
    <title>Redirecting...</title>
  </head>
  <body></body>
</html>
